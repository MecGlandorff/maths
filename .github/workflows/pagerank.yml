name: PageRank

on:
  pull_request:
    paths:
      - pagerank.cpp
      - tests/test_pagerank.py
      - .github/workflows/pagerank.yml
  push:
    branches: [master]
    paths:
      - pagerank.cpp
      - tests/test_pagerank.py
      - .github/workflows/pagerank.yml

permissions:
  contents: read

jobs:
  verify:
    name: PageRank (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check stationary distributions, personalization, and convergence
        run: python3 tests/test_pagerank.py
