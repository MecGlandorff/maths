name: Backpropagation

on:
  pull_request:
    paths:
      - backpropagation.cpp
      - tests/test_backpropagation.py
      - .github/workflows/backpropagation.yml
  push:
    branches: [master]
    paths:
      - backpropagation.cpp
      - tests/test_backpropagation.py
      - .github/workflows/backpropagation.yml

permissions:
  contents: read

jobs:
  verify:
    name: Backpropagation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check chain-rule derivatives, training, and numerical limits
        run: python3 tests/test_backpropagation.py
