name: Gradient descent

on:
  pull_request:
    paths:
      - gradient_descent.cpp
      - tests/test_gradient_descent.py
      - .github/workflows/gradient-descent.yml
  push:
    branches: [master]
    paths:
      - gradient_descent.cpp
      - tests/test_gradient_descent.py
      - .github/workflows/gradient-descent.yml

permissions:
  contents: read

jobs:
  verify:
    name: Gradient descent (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check gradients, trajectories, and convergence analysis
        run: python3 tests/test_gradient_descent.py
