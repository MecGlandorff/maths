name: Attention

on:
  pull_request:
    paths:
      - attention.cpp
      - tests/test_attention.py
      - .github/workflows/attention.yml
  push:
    branches: [master]
    paths:
      - attention.cpp
      - tests/test_attention.py
      - .github/workflows/attention.yml

permissions:
  contents: read

jobs:
  verify:
    name: Attention (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check attention weights, masking, and gradients
        run: python3 tests/test_attention.py
